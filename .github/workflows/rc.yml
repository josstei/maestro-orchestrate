name: Release Candidate

on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  rc:
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      contains(github.event.pull_request.labels.*.name, 'rc') &&
      contains(github.event.pull_request.labels.*.name, 'release') &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    concurrency:
      group: rc-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install build dependencies
        run: npm ci

      - name: Check generated output drift
        run: node scripts/generate.js --check

      - name: Run full test suite
        run: npm test

      - name: Determine RC version
        if: env.NPM_TOKEN != ''
        id: rc
        run: |
          BASE=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          EXISTING=$(npm view "$PACKAGE_NAME" versions --json 2>/dev/null || echo '[]')
          RC_NUM=1

          while echo "$EXISTING" | grep -q "\"${BASE}-rc.${RC_NUM}\""; do
            RC_NUM=$((RC_NUM + 1))
          done

          RC_VERSION="${BASE}-rc.${RC_NUM}"
          echo "version=$RC_VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish RC
        if: env.NPM_TOKEN != ''
        uses: ./.github/actions/publish-prerelease
        with:
          version: ${{ steps.rc.outputs.version }}
          tag: rc
          comment-prefix: 'Release candidate published:'
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
