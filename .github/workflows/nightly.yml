name: Nightly Build

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  nightly:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/heads/main

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install build dependencies
        run: npm ci

      - name: Check generated output drift
        run: node scripts/generate.js --check

      - name: Run full test suite
        run: npm test

      - name: Set nightly version
        if: env.NPM_TOKEN != ''
        run: |
          BASE=$(node -p "require('./package.json').version")
          NIGHTLY="${BASE}-nightly.$(date +%Y%m%d)"
          npm version "$NIGHTLY" --no-git-tag-version

      - name: Regenerate runtime metadata
        if: env.NPM_TOKEN != ''
        run: node scripts/generate.js

      - name: Verify npm package contents
        if: env.NPM_TOKEN != ''
        run: npm run pack:verify

      - name: Publish nightly
        if: env.NPM_TOKEN != ''
        run: node scripts/npm-publish-idempotent.js --tag nightly --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
