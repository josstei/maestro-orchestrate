name: Nightly Build

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  nightly:
    uses: ./.github/workflows/prerelease-publish.yml
    with:
      dist-tag: nightly
      checkout-ref: refs/heads/main
      version-command: |
        BASE=$(node -p "require('./package.json').version")
        NIGHTLY="${BASE}-nightly.$(date +%Y%m%d)"
        npm version "$NIGHTLY" --no-git-tag-version
    secrets: inherit
