name: Preview Build

on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    if: contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install build dependencies
        run: npm ci

      - name: Check generated output drift
        run: node scripts/generate.js --check

      - name: Run full test suite
        run: npm test

      - name: Determine preview version
        if: env.NPM_TOKEN != ''
        id: preview
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BASE=$(node -p "require('./package.json').version")
          SHORT_SHA="${HEAD_SHA:0:7}"
          PREVIEW="${BASE}-preview.${SHORT_SHA}"
          echo "version=$PREVIEW" >> "$GITHUB_OUTPUT"

      - name: Publish preview
        if: env.NPM_TOKEN != ''
        uses: ./.github/actions/publish-prerelease
        with:
          version: ${{ steps.preview.outputs.version }}
          tag: preview
          comment-prefix: 'Preview published:'
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
