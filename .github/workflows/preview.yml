name: Preview Build

on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    if: contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install build dependencies
        run: npm ci

      - name: Check generated output drift
        run: node scripts/generate.js --check

      - name: Run full test suite
        run: npm test

      - name: Set preview version
        if: env.NPM_TOKEN != ''
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BASE=$(node -p "require('./package.json').version")
          SHORT_SHA="${HEAD_SHA:0:7}"
          PREVIEW="${BASE}-preview.${SHORT_SHA}"
          npm version "$PREVIEW" --no-git-tag-version

      - name: Regenerate runtime metadata
        if: env.NPM_TOKEN != ''
        run: node scripts/generate.js

      - name: Verify npm package contents
        if: env.NPM_TOKEN != ''
        run: npm run pack:verify

      - name: Publish preview
        if: env.NPM_TOKEN != ''
        run: node scripts/npm-publish-idempotent.js --tag preview --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Upsert PR comment
        if: env.NPM_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA="${HEAD_SHA:0:7}"
          BODY="Preview published: \`npm install ${PACKAGE_NAME}@${VERSION}\`

          Built from \`${SHORT_SHA}\`"

          EXISTING=$(gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq 'map(select(.body | startswith("Preview published:"))) | .[0].id')

          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh api "repos/$REPOSITORY/issues/comments/$EXISTING" \
              -X PATCH \
              -f body="$BODY"
          else
            gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
              -X POST \
              -f body="$BODY"
          fi
