name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (leave empty for auto-inference from commits)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::This workflow must be run from the main branch"
          exit 1

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install build dependencies
        run: npm ci

      - name: Resolve and validate target version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            NEXT="$INPUT_VERSION"
          else
            CURRENT=$(node -p "require('./package.json').version")
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            LOGS=$(git log "v${CURRENT}..HEAD" --oneline 2>/dev/null || git log --oneline -50)
            BUMP="patch"

            if echo "$LOGS" | grep -qiE 'BREAKING CHANGE|!:'; then
              BUMP="major"
            elif echo "$LOGS" | grep -qiE '^[a-f0-9]+ feat'; then
              BUMP="minor"
            fi

            case "$BUMP" in
              major) NEXT="$((MAJOR + 1)).0.0" ;;
              minor) NEXT="${MAJOR}.$((MINOR + 1)).0" ;;
              patch) NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
            esac

            echo "Inferred version: $NEXT (bump: $BUMP)"
          fi

          if [[ ! "$NEXT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must match major.minor.patch; received '$NEXT'"
            exit 1
          fi

          echo "VERSION=$NEXT" >> "$GITHUB_ENV"

      - name: Check adapter drift
        run: node scripts/generate.js --check

      - name: Run full test suite
        run: npm test

      - name: Create release branch
        run: |
          git checkout -b "release/v${VERSION}"

      - name: Update canonical release inputs
        run: node scripts/update-versions.js "$VERSION"

      - name: Regenerate with new version
        run: |
          node scripts/generate.js
          npm install --package-lock-only

      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: v${VERSION}"

      - name: Push release branch
        run: |
          git push origin "release/v${VERSION}"

      - name: Open release PR to main
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          CHANGELOG_EXCERPT=$(awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found=1; next }
            /^## \[/ && found { exit }
            found { print }
          ' CHANGELOG.md)
          gh pr create \
            --repo "$REPOSITORY" \
            --base main \
            --head "release/v${VERSION}" \
            --title "release: v${VERSION}" \
            --body "$(cat <<EOF
          ## Release v${VERSION}

          ${CHANGELOG_EXCERPT}
          EOF
          )"

      - name: Label release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          PR_NUMBER=$(gh pr list \
            --repo "$REPOSITORY" \
            --base main \
            --head "release/v${VERSION}" \
            --json number \
            --jq '.[0].number')
          gh pr edit \
            --repo "$REPOSITORY" \
            "$PR_NUMBER" \
            --add-label release \
            --add-label rc
