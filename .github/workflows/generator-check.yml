name: Source Of Truth Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-architecture:
    name: source-of-truth-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build dependencies
        run: npm ci

      - name: Generate runtime adapters
        run: node scripts/generate.js

      - name: Check adapter drift
        run: |
          if ! git diff --exit-code --name-only; then
            echo "::error::Runtime adapters are out of sync with canonical src. Run 'node scripts/generate.js' and commit the changes."
            git diff --stat
            exit 1
          fi

      - name: Run full test suite
        run: npm test

      - name: Verify npm package contents
        run: npm run pack:verify

      - name: Package release artifact
        run: npm run release:artifacts

      - name: Verify release artifact
        run: npm run release:verify-artifacts

  state-portability:
    name: state-${{ matrix.os }}-node-${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '24']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install build dependencies
        run: npm ci

      - name: Verify state concurrency, recovery, and compatibility
        shell: bash
        run: >-
          node --test
          tests/unit/state-coordinator.test.js
          tests/unit/session-state.test.js
          tests/unit/design-gate.test.js
          tests/unit/reconciliation.test.js
          tests/unit/hook-logic.test.js
          tests/integration/state-scripts.test.js
          tests/integration/state-coordination-contract.test.js
